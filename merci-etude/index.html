<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Demande envoyée | FinancementsPME.fr</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#0d3042;--navy2:#12394d;--green:#6fe0b5;--ivory:#fcfbf8;--text:#233e4d}
*{box-sizing:border-box}body{margin:0;font-family:'Manrope',sans-serif;background:linear-gradient(180deg,var(--navy),#082637);color:white;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(720px,100%);background:var(--ivory);color:var(--text);border-radius:18px;padding:48px;border:1px solid rgba(255,255,255,.3);box-shadow:0 30px 80px rgba(0,0,0,.25);text-align:center}
.icon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;background:#e8f7f0;color:#178f69;font-size:30px;font-weight:700}
.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;color:#6c827a}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(36px,6vw,58px);line-height:1.02;margin:12px 0 18px;color:#17384e}
p{color:#647983;line-height:1.7;font-size:16px;margin:0 auto 26px;max-width:560px}
a{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:6px;background:#17384e;color:white;text-decoration:none;font-weight:700;font-size:13px}
small{display:block;margin-top:22px;color:#8a9aa2}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <div class="kicker">Demande transmise</div>
    <h1>Votre étude a bien été envoyée.</h1>
    <p>Merci. Votre demande a été transmise à <strong>contact@financementspme.fr</strong>. Un membre de l'équipe vous recontactera sous 24 à 48h ouvrées pour une première qualification.</p>
    <a href="/">Retour à l'accueil →</a>
    <small>FinancementsPME.fr · Étude confidentielle et sans engagement</small>
  </main>
</body>
</html>
